[package]
name = "frontend"
version = "0.1.0"
edition = "2024"
publish = false

[package.metadata.leptos]
output-name = "frontend"
site-root = "target/site"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3000"
reload-port = 3001
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
browserquery = "defaults"
bin-features = ["ssr"]
bin-default-features = false
lib-features = ["hydrate"]
lib-default-features = false
lib-profile-release = "wasm-release"
bin-profile-release = "server-release"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
hydrate = ["dep:tracing-wasm", "leptos/hydrate", "leptonic/hydrate"]
ssr = [
    "dep:axum",
    "dep:axum-server",
    "dep:tokio",
    "dep:tower",
    "dep:tower-http",
    "dep:tracing-subscriber",
    "dep:leptos_axum",
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "leptos-keycloak-auth/ssr",
    "leptos-use/ssr",
    "leptonic/ssr",
]

[dependencies]
axum = { version = "0.8.9", default-features = false, features = [], optional = true }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"], optional = true }
console_error_panic_hook = { version = "0.1.7", default-features = false, features = [] }
dotenv_codegen = { version = "0.15.0", default-features = false, features = [] }
dotenvy = { version = "0.15.7", default-features = false, features = [] }
indoc = { version = "2.0.8", default-features = false, features = [] }
leptonic = { git = "https://github.com/lpotthast/leptonic", branch = "hooks", default-features = false, features = ["atoms"] }
leptos = { version = "0.8.22", default-features = false, features = [] }
leptos-keycloak-auth = { path = "../leptos-keycloak-auth", default-features = false, features = ["internals"] }
leptos-routes = { version = "0.4.2", default-features = false, features = [] }
leptos-use = { version = "0.19.2", default-features = false, features = [] }
leptos_axum = { version = "0.8.10", default-features = false, features = ["default"], optional = true }
leptos_meta = { version = "0.8.7", default-features = false, features = [] }
leptos_router = { version = "0.8.17", default-features = false, features = [] }
serde = { version = "1.0.229", default-features = false, features = [] }
tokio = { version = "1.53.2", default-features = false, features = ["rt-multi-thread"], optional = true }
tower = { version = "0.5.3", default-features = false, features = [], optional = true }
tower-http = { version = "0.7.1", default-features = false, features = ["fs"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = [] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "registry", "ansi"], optional = true }
tracing-wasm = { version = "0.2.1", default-features = false, features = [], optional = true }
wasm-bindgen = { version = "0.2.129", default-features = false, features = [] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", default-features = false, features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", default-features = false, features = ["wasm_js"] }
js-sys = { version = "0.3", default-features = false, features = [] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Profiles as recommended by leptonic (its book's guide "Optimizing Compile Times & Binary Sizes").
# The test-frontend is only built with `cargo leptos --release`, which selects them per target: see
# `lib-profile-release` and `bin-profile-release` above. The server's profile builds on `dev`.

[profile.dev]
# Line tables keep panic locations and backtraces of our own code at a fraction of full debug info.
debug = "line-tables-only"

[profile.dev.package."*"]
# No debug info for dependencies: smaller target directories and faster links.
# No `opt-level` here: profiles inheriting dev would inherit it, overriding their own for every dependency.
debug = false

# The wasm of release builds: size-optimized, but without LTO and with the default codegen units and incremental
# compilation, so that rebuilds stay fast. For production-grade builds, additionally set
# `CARGO_PROFILE_WASM_RELEASE_LTO=true` and `CARGO_PROFILE_WASM_RELEASE_CODEGEN_UNITS=1`.
[profile.wasm-release]
inherits = "release"
opt-level = "z"
incremental = true
debug-assertions = true
overflow-checks = true

# The server of release builds: the dev profile, slightly optimized.
[profile.server-release]
inherits = "dev"
opt-level = 1
